<head>

<title>Naruto Auto Arena</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#10192e;color:white;font-family:Arial;text-align:center}
header{background:#18263e;padding:18px;color:#ffa52c}
h1{font-size:27px;margin:5px}
.arena{height:310px;background:linear-gradient(#293c63,#546c91);position:relative;overflow:hidden}
.sun{position:absolute;right:35px;top:30px;background:#ffcb75;border-radius:50%;width:65px;height:65px}
.ground{position:absolute;bottom:0;width:100%;height:70px;background:#345c47}
.fighter{position:absolute;bottom:65px;font-size:75px;transition:transform .25s}
#hero{left:12%}#enemy{right:12%}
.attack{transform:translateX(45px) scale(1.15)!important}
.hurt{filter:brightness(2)}
.effect{position:absolute;top:100px;width:100%;font-size:48px;pointer-events:none}
.panel{padding:16px}
.bars{display:flex;gap:15px;justify-content:space-between}
.unit{width:48%}
.bar{background:#712c38;border-radius:20px;height:16px;overflow:hidden;margin-top:8px}
.fill{height:100%;background:#39d68c;width:100%;transition:width .3s}
button{background:#ffa52c;color:#152037;border:0;border-radius:14px;padding:16px 8px;font-weight:bold;font-size:14px}
.upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
#log{min-height:65px;color:#b9d1fa;margin-top:18px}
.stats{margin-top:15px;font-size:17px}
</style>
<style>
body{background:#10151d;font-family:system-ui,-apple-system,sans-serif}
header{background:linear-gradient(120deg,#171c29,#392b2c);border-bottom:2px solid #dc852d;padding:14px}
h1{font-size:clamp(21px,5vw,30px);text-shadow:0 2px 3px #111}
.arena{height:min(58vh,460px);min-height:340px;background:linear-gradient(#8ac2dc,#e9c69b 58%,#9d8e74 59%,#64754c);isolation:isolate}
.sun{right:14%;top:11%;background:#fff0b5;box-shadow:0 0 55px #fff4b0}
.mountain{position:absolute;inset:7% 0 32%;background:linear-gradient(#9e9d91,#7c827d);clip-path:polygon(0 75%,15% 45%,28% 57%,44% 15%,57% 45%,72% 8%,100% 50%,100% 100%,0 100%)}
.hokage{position:absolute;top:23%;left:23%;font-size:clamp(25px,8vw,50px);letter-spacing:8px;color:#615f59;opacity:.55;font-weight:900;text-shadow:2px 3px #c4baac}
.village{position:absolute;bottom:25%;height:30%;width:100%;display:flex;justify-content:space-around;align-items:end}
.house{height:60%;width:21%;border:3px solid #9c6349;border-radius:6px;background:linear-gradient(#e1b47f,#bf7956);position:relative}
.house:before{content:"";position:absolute;top:-16%;left:-12%;width:124%;height:24%;background:#a95239;border-radius:50% 50% 15% 15%}
.house:nth-child(2){height:90%;width:25%;border-radius:40% 40% 6px 6px}
.house:nth-child(3){height:72%}
.ground{height:27%;background:linear-gradient(#758a5d,#6b7957 25%,#70664e);border-top:5px solid #b2a07d}
.fighter{bottom:11%;font-size:unset;width:34%;height:55%;max-width:190px;filter:drop-shadow(2px 8px 5px #0008);z-index:3}
.fighter svg{width:100%;height:100%;overflow:visible}
#hero{left:5%}#enemy{right:4%;transform:scaleX(-1)}
#enemy.hurt{filter:brightness(1.8) drop-shadow(0 0 12px #fff)}
.clones{position:absolute;bottom:18%;left:18%;width:40%;height:34%;z-index:2;display:none;opacity:.65}
.clones.active{display:flex;animation:clonepop .6s ease-out}
.clones svg{width:50%;height:100%}
@keyframes clonepop{from{opacity:0;transform:scale(.7)}to{opacity:.65;transform:scale(1)}}
.rasengan{position:absolute;left:32%;bottom:37%;width:65px;height:65px;z-index:6;border-radius:50%;display:none;background:radial-gradient(circle,#fff,#8cf5ff 25%,#2da9fa 53%,#0054bf 75%,transparent 80%);box-shadow:0 0 24px 10px #69dfff}
.rasengan.active{display:block;animation:rasfly .7s ease-in forwards}
@keyframes rasfly{from{transform:translateX(0) scale(.6)}to{transform:translateX(180%) scale(1.5);opacity:0}}
.panel{background:linear-gradient(#23283a,#111725);padding:15px}
button{background:linear-gradient(#ffc35b,#e8902e);box-shadow:0 3px 0 #90531e;border:1px solid #ffd17d}
button:active{transform:translateY(2px)}
#log{color:#ffdfae}
@media(min-width:650px){body{max-width:650px;margin:auto}}
</style><style>
/* Visual update: richer village, shadows, battle motion */
.arena{background:linear-gradient(180deg,#7fc4e3 0%,#c9d9c3 48%,#e4c19b 72%,#83946e 100%)}

.village{filter:drop-shadow(0 5px 3px #513f3580)}
.house{box-shadow:inset -14px 0 0 #754c3c44,0 4px 2px #4c483c55}
.house:after{content:"";position:absolute;left:37%;top:40%;height:26%;width:25%;border:4px solid #765449;background:#b8d6d4;box-shadow:inset 0 0 0 2px #f5d9a5}
.ground{background:linear-gradient(180deg,#6c9d64,#536f49 22%,#73634b 24%,#85734d 65%,#6b7047);box-shadow:inset 0 12px 15px #0002}
.fighter{transform-origin:50% 100%;animation:breathe 1.5s ease-in-out infinite;will-change:transform}
#enemy{animation:enemybreathe 1.7s ease-in-out infinite}
.fighter:after{content:"";position:absolute;left:13%;right:13%;bottom:-8px;height:13px;background:#172b1d66;border-radius:50%;filter:blur(5px);z-index:-1}
#hero.attack{animation:heroStrike .34s ease-in-out!important}
#enemy.hurt{animation:enemyHit .3s ease-out!important;filter:brightness(1.9) drop-shadow(0 0 12px #ff5959)}
@keyframes breathe{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
@keyframes enemybreathe{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-5px)}}
@keyframes heroStrike{0%{transform:translateX(0)}45%{transform:translateX(80px) rotate(7deg) scale(1.08)}100%{transform:translateX(0)}}
@keyframes enemyHit{0%{transform:scaleX(-1) translateX(0)}40%{transform:scaleX(-1) translateX(-20px) rotate(-7deg)}100%{transform:scaleX(-1) translateX(0)}}
.arena:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:7;background:radial-gradient(ellipse at center,transparent 52%,#252b3844 100%)}
.rasengan.active{animation:rasfly .7s cubic-bezier(.25,.6,.6,1) forwards;box-shadow:0 0 12px 6px #a7f9ff,0 0 45px 18px #348cfa}
#log{font-weight:600}
@media(max-width:400px){.fighter{width:39%}#hero{left:1%}#enemy{right:1%}}
</style><style>
/* Combat effects v4 */
.arena{overflow:hidden}
.speedlines{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;background:repeating-linear-gradient(170deg,transparent 0 17px,#fff8 19px 21px,transparent 23px 47px)}
.speedlines.active{animation:speedFlash .42s ease-out}

.hitnumber{position:absolute;top:38%;left:69%;z-index:9;font-weight:1000;font-size:clamp(25px,6vw,42px);color:#fff4ac;text-shadow:2px 3px #a82e25,-1px -1px #7b2d1a;opacity:0;pointer-events:none}
.hitnumber.active{animation:damageFloat .65s ease-out forwards}
@keyframes damageFloat{0%{opacity:1;transform:translateY(12px) scale(.6)}25%{opacity:1;transform:translateY(-5px) scale(1.25)}100%{opacity:0;transform:translateY(-52px) scale(.95)}}
.shockwave{position:absolute;left:68%;top:48%;width:16px;height:16px;border:5px solid #e5faff;border-radius:50%;z-index:8;opacity:0;pointer-events:none}

.jutsu-label{position:absolute;left:0;right:0;top:8%;z-index:9;text-align:center;font-size:clamp(18px,4.5vw,29px);font-weight:1000;color:#fff;text-shadow:0 2px #0b477b,0 0 15px #36bcff;opacity:0;pointer-events:none}
.jutsu-label.active{animation:jutsuShow .9s ease-out}
@keyframes jutsuShow{0%{opacity:0;transform:scale(.6)}20%,70%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.2)}}
.rasengan{background:repeating-conic-gradient(from 20deg,#5ce1ff 0 25deg,#c8ffff 25deg 50deg,#1479df 50deg 75deg);border:4px solid #b9ffff}
.rasengan.active{animation:rasfly .7s cubic-bezier(.25,.6,.6,1) forwards,chakraSpin .14s linear infinite}
@keyframes chakraSpin{to{filter:hue-rotate(35deg)}}
</style><style>
#hitnumber{position:absolute!important;top:29%!important;left:58%!important;z-index:999!important;display:block!important;opacity:0;font-size:46px!important;color:#fff36a!important;font-weight:1000!important;text-shadow:3px 3px 0 #9b1c17,0 0 18px #ff6d00!important;pointer-events:none}
#hitnumber.active{animation:floatHit .9s ease-out forwards!important}
#hitnumber.critical{color:#ffcf21!important;font-size:58px!important;text-shadow:3px 3px #ae1515,0 0 24px #ff4a00!important}
@keyframes floatHit{0%{opacity:0;transform:translateY(18px) scale(.5)}15%{opacity:1;transform:translateY(0) scale(1.2)}70%{opacity:1;transform:translateY(-35px) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(.9)}}
#startOverlay{position:absolute;inset:0;background:#0b1420e8;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#startOverlay h2{font-size:32px;color:#ffb341;margin:0;text-shadow:0 3px #673a1a}
#startOverlay p{margin:0;color:#e4e6f0}
#startButton,#pauseButton{font-size:18px;padding:15px 26px;border-radius:14px;cursor:pointer}
#pauseButton{background:#26394d;color:white;border:1px solid #6883a0;box-shadow:none}
.controls{display:flex;justify-content:center;gap:12px;margin-top:12px}
#criticalStats{color:#ffdb8a;font-size:15px;margin-top:9px}
.upgrades{grid-template-columns:repeat(2,minmax(0,1fr))}
.upgrades button{min-height:64px}
</style></head>

/><rect x="60" y="57" width="32" height="14" rx="4" fill="#c7cdd0"/><path d="M69 65q8 -10 17 0q-9 8 -17 0" fill="none" stroke="#536371" stroke-width="2"/><path d="M51 82l15 1m18 0l15 -1" stroke="#29303a" stroke-width="5"/><path d="M55 86l8 1m26 0l8 -1" stroke="#f7f8ff" stroke-width="4"/><path d="M48 94l-15 -3m15 9l-15 1m68 -7l15 -3m-15 9l15 1" stroke="#a66c52" stroke-width="2.5"/><path d="M66 105Q75 111 85 105" fill="none" stroke="#9d5c48" stroke-width="2"/></svg></div><div id="hero" class="fighter"><svg viewBox="0 0 150 210" xmlns="http://www.w3.org/2000/svg"><path d="M24 208L22 128Q29 109 52 103H99Q125 109 130 130L128 208" fill="#f18c28" stroke="#303443" stroke-width="6"/><path d="M52 134L75 164L99 134" fill="#232b39" stroke="#e0b58b" stroke-width="5"/><path d="M54 172L54 208M97 172L97 208" stroke="#313544" stroke-width="9"/><path d="M46 110L36 142L58 152M105 110L116 142L95 152" fill="#f18c28" stroke="#333b48" stroke-width="5"/><path d="M45 68Q39 36 75 29Q110 36 105 72L101 100Q75 125 49 101Z" fill="#f7c18a" stroke="#54382d" stroke-width="3"/><path d="M40 58L31 38L46 40L43 18L61 29L73 6L82 26L105 13L103 35L120 31L109 57Z" fill="#f7cb31" stroke="#ae7b2d" stroke-width="3"/><path d="M43 59Q75 49 107 59L106 75Q75 68 44 75Z" fill="#28384c"/><rect x="60" y="57" width="32" height="14" rx="4" fill="#c7cdd0"/><path d="M69 65q8 -10 17 0q-9 8 -17 0" fill="none" stroke="#536371" stroke-width="2"/><path d="M51 82l15 1m18 0l15 -1" stroke="#29303a" stroke-width="5"/><path d="M55 86l8 1m26 0l8 -1" stroke="#f7f8ff" stroke-width="4"/><path d="M48 94l-15 -3m15 9l-15 1m68 -7l15 -3m-15 9l15 1" stroke="#a66c52" stroke-width="2.5"/><path d="M66 105Q75 111 85 105" fill="none" stroke="#9d5c48" stroke-width="2"/></svg></div>
<div id="enemy" class="fighter"><svg viewBox="0 0 150 210" xmlns="http://www.w3.org/2000/svg"><path d="M26 208L23 120Q29 105 53 101L99 101Q123 105 130 127L127 208" fill="#1d2029" stroke="#9d3136" stroke-width="5"/><path d="M50 101L75 158L101 101" fill="#2d2d37" stroke="#b33b40" stroke-width="5"/><path d="M51 172q17 -20 36 -2q-10 20 -31 11q-8 -3 -5 -9" fill="#bb343a" stroke="#e9d7c9" stroke-width="2"/><path d="M48 61Q46 32 75 32Q106 32 105 64L102 100Q76 122 49 100Z" fill="#dcb9a2" stroke="#302529" stroke-width="4"/><path d="M36 63Q35 17 75 15Q117 17 115 65L104 49L96 34L54 34L47 53Z" fill="#20212a"/><path d="M46 67L69 72M81 72L103 67" stroke="#2a252c" stroke-width="5"/><path d="M51 77h18m12 0h18" stroke="#c62d31" stroke-width="5"/><circle cx="60" cy="77" r="3" fill="#20202a"/><circle cx="90" cy="77" r="3" fill="#20202a"/><path d="M74 79l-3 15h8M65 102q10 5 20 0" fill="none" stroke="#8d6661" stroke-width="2"/></svg></div><div id="rasengan" class="rasengan"></div><div id="speedlines" class="speedlines"></div><div id="hitnumber" class="hitnumber"></div><div id="startOverlay"><h2>🍥 NARUTO ARENA</h2><p>Автоматические бои, прокачка и техники ниндзя</p><button id="startButton" onclick="startGame()">⚔️ НАЧАТЬ ИГРУ</button><p id="startInfo">Нажми, чтобы выйти на арену</p></div><div id="shockwave" class="shockwave"></div><div id="jutsulabel" class="jutsu-label"></div>

<div class="panel">
<div class="bars">
<div class="unit">Наруто ур. <span id="level">1</span>
<div class="bar"><div id="hpbar" class="fill"></div></div></div>
<div class="unit">Противник <span id="wave">1</span>
<div class="bar"><div id="enemybar" class="fill"></div></div></div>
</div>

<div id="criticalStats">🎯 Крит. шанс: <b id="critChance">5%</b> · 💥 Крит. урон: <b id="critDamage">150%</b></div><div class="controls"><button id="pauseButton" onclick="togglePause()">⏸ Пауза</button></div><div class="upgrades">
<button onclick="upgrade('damage')">⚔️ Урон<br>20 🪙</button>
<button onclick="upgrade('speed')">⚡ Скорость<br>25 🪙</button>
<button onclick="upgrade('hp')">❤️ HP<br>20 🪙</button><button onclick="upgrade('critChance')">🎯 Крит. шанс +2%<br>40 🪙</button><button onclick="upgrade('critDamage')">💥 Крит. урон +15%<br>40 🪙</button>
</div>
<div id="log">⚔️ Автобой начался</div>
</div>
<script>
const el=id=>document.getElementById(id);
let s;
try{s=JSON.parse(localStorage.getItem('narutoSave')||'null')}catch(e){}
s=Object.assign({coins:0,level:1,wave:1,damage:12,speed:10,maxHp:100,critChance:5,critDamage:150},s||{});
s.critChance=Number(s.critChance)||5;s.critDamage=Number(s.critDamage)||150;
let hp=s.maxHp,enemyHp=100+s.wave*25,maxEnemy=enemyHp,turn=0;
let started=false,paused=false,timer=null;
function save(){localStorage.setItem('narutoSave',JSON.stringify(s))}
function render(){
el('coins').textContent=s.coins;el('level').textContent=s.level;el('wave').textContent=s.wave;el('speed').textContent=s.speed;
el('hpbar').style.width=Math.max(0,hp/s.maxHp*100)+'%';el('enemybar').style.width=Math.max(0,enemyHp/maxEnemy*100)+'%';
el('critChance').textContent=s.critChance+'%';el('critDamage').textContent=s.critDamage+'%';
}
function log(t){el('log').textContent=t}
function pulse(id,duration=700){const node=el(id);if(!node)return;node.classList.remove('active');void node.offsetWidth;node.classList.add('active');setTimeout(()=>node.classList.remove('active'),duration)}
function effect(t){let special=t.includes('Расенган');pulse(special?'rasengan':'clones');pulse('speedlines',450);el('jutsulabel').textContent=special?'螺旋丸 • РАСЕНГАН!':'影分身 • ТЕНЕВЫЕ КЛОНЫ!';pulse('jutsulabel',950)}
function showDamage(d,critical){
let n=el('hitnumber');n.classList.remove('active','critical');void n.offsetWidth;n.textContent=(critical?'КРИТ! ':'−')+d;if(critical)n.classList.add('critical');n.classList.add('active');pulse('shockwave',500);
}
function upgrade(type){
let cost=type==='speed'?25:(type==='critChance'||type==='critDamage'?40:20);
if(s.coins<cost){log('Недостаточно монет! Нужно '+cost+' 🪙');return}
if(type==='critChance'&&s.critChance>=75){log('Максимальный крит. шанс 75%');return}
s.coins-=cost;
if(type==='damage')s.damage+=5;
if(type==='speed')s.speed+=3;
if(type==='hp'){s.maxHp+=25;hp+=25}
if(type==='critChance')s.critChance=Math.min(75,s.critChance+2);
if(type==='critDamage')s.critDamage+=15;
save();render();log('Улучшение куплено!');
}
function hit(){
turn++;let dmg=s.damage;
let crit=Math.random()*100<s.critChance;
el('hero').classList.add('attack');el('enemy').classList.add('hurt');
setTimeout(()=>el('enemy').classList.remove('hurt'),200);
setTimeout(()=>el('hero').classList.remove('attack'),260);
let skill='';
if(turn%7===0){dmg*=4;skill='Расенган';effect('Расенган')}
else if(turn%3===0){dmg*=2;skill='Теневые клоны';effect('Клоны')}
if(crit)dmg=Math.round(dmg*s.critDamage/100);
dmg=Math.round(dmg);enemyHp-=dmg;
showDamage(dmg,crit);
log((skill?skill+'! ':'Наруто атакует! ')+(crit?'💥 КРИТ! ':'')+'−'+dmg+' HP');
if(enemyHp<=0){
s.coins+=15+s.wave*5;s.level++;s.wave++;maxEnemy=100+s.wave*25;enemyHp=maxEnemy;hp=s.maxHp;
save();log('🏆 Победа! Волна '+s.wave+' · награда получена!');
}else{
hp-=Math.max(2,14-Math.floor(s.speed/5));
if(hp<=0){hp=s.maxHp;log('Наруто восстановился!')}
}
render();
}
function schedule(){clearTimeout(timer);if(!started||paused)return;timer=setTimeout(()=>{hit();schedule()},Math.max(350,1400-s.speed*35))}
function startGame(){started=true;paused=false;el('startOverlay').style.display='none';el('pauseButton').textContent='⏸ Пауза';log('⚔️ Бой начался!');schedule()}
function togglePause(){
if(!started){startGame();return}
paused=!paused;el('pauseButton').textContent=paused?'▶️ Продолжить':'⏸ Пауза';
log(paused?'⏸ Бой на паузе':'⚔️ Бой продолжается');schedule();
}
render();
