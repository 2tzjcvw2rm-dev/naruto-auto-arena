name: Kakashi mobile WebKit
on:
  push:
    branches: [main]
    paths: ['index.html', 'test-3d/**', 'tests/kakashi-*.cjs', '.github/workflows/kakashi-mobile-qa.yml']
  workflow_dispatch:
jobs:
  kakashi-webkit:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install webkit
      - run: node tests/kakashi-combat.cjs
      - run: node tests/kakashi-mobile.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kakashi-mobile-webkit
          path: artifacts/
