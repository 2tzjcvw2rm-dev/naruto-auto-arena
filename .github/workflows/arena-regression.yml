name: 3D arena regression
on:
  push:
    branches:
      - main
      - feature/madara-susanoo-20261105
      - feature/madara-profile-susanoo-20261105
      - feature/calm-waterfall-manual-battle-speed-20261105
      - feature/ultimate-every-third-turn-20261105
      - feature/konoha-animated-battle-20261105
      - feature/waterfall-gif-5v5-20261105
    paths:
      - 'test-3d/**'
      - 'tests/side-battle.cjs'
      - 'tests/battle-cinematics.cjs'
      - 'tests/madara-profile.cjs'
      - 'tests/battle-tempo.cjs'
      - 'tests/ultimate-cycle.cjs'
      - 'index.html'
      - '.github/workflows/arena-regression.yml'
  workflow_dispatch:
jobs:
  side-view-battle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check test-3d/battle-environment.js
          node --check test-3d/battle-scene.js
          node --check test-3d/battle-pose.js
          node --check test-3d/battle-cinematics.js
          node --check test-3d/battle-visual-upgrade.js
          node --check test-3d/battle-ultimate-fx.js
          node --check tests/battle-cinematics.cjs
          node --check test-3d/madara-profile.js
          node --check test-3d/battle-speed.js
          node --check test-3d/battle-backdrop.js
          node --check tests/battle-tempo.cjs
          node --check tests/ultimate-cycle.cjs
          node --check tests/madara-profile.cjs
          node --check tests/side-battle.cjs
      - name: Check fighters, formations and techniques
        run: |
          node tests/side-battle.cjs
          node tests/battle-cinematics.cjs
          node tests/susanoo.cjs
          node tests/madara-profile.cjs
          node tests/battle-tempo.cjs
          node tests/ultimate-cycle.cjs
