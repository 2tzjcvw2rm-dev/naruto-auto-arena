name: iPhone-size WebKit arena QA
on:
  push:
    branches:
      - main
      - feature/madara-susanoo-20261105
      - feature/konoha-animated-battle-20261105
      - feature/waterfall-gif-5v5-20261105
    paths:
      - 'index.html'
      - 'test-3d/**'
      - 'tests/konoha-mobile.cjs'
      - '.github/workflows/konoha-mobile-qa.yml'
  workflow_dispatch:
jobs:
  webkit:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit test runner
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install webkit
      - name: Test the real 5v5 battle in mobile WebKit
        run: node tests/konoha-mobile.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: konoha-iphone-webkit
          path: artifacts/
          if-no-files-found: ignore

  webkit-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps webkit
      - run: xvfb-run -a node tests/konoha-mobile.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: susanoo-linux-webkit
          path: artifacts/
          if-no-files-found: ignore
