name: Madara mobile WebKit
on:
  push:
    branches: [main]
    paths: ['index.html', 'test-3d/**', 'tests/madara-*.cjs', '.github/workflows/madara-mobile-qa.yml']
  workflow_dispatch:
jobs:
  madara-webkit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps webkit
      - run: node tests/madara-combat.cjs
      - run: node tests/madara-mobile.cjs
        if: runner.os == 'macOS'
      - run: xvfb-run -a node tests/madara-mobile.cjs
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madara-mobile-webkit-${{ runner.os }}
          path: artifacts/
