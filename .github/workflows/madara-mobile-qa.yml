name: Madara mobile WebKit
on:
  push:
    branches: [main]
    paths: ['index.html', 'test-3d/**', 'tests/madara-*.cjs', '.github/workflows/madara-mobile-qa.yml']
  workflow_dispatch:
jobs:
  madara-webkit:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install webkit
      - run: node tests/madara-combat.cjs
      - run: node tests/madara-mobile.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madara-mobile-webkit
          path: artifacts/
